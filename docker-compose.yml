services:
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    command: npm run dev
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    volumes:
      - ./apps/frontend:/app/apps/frontend
      - frontend_node_modules:/app/apps/frontend/node_modules
    depends_on:
      backend:
        condition: service_started

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      # The durable PostgreSQL/realtime path must fail closed without its
      # ticket-signing boundary rather than start partially configured.
      REALTIME_TICKET_SIGNING_KEY: ${REALTIME_TICKET_SIGNING_KEY:?REALTIME_TICKET_SIGNING_KEY must be set}
    volumes:
      - ./apps/backend:/app/apps/backend
      - ./packages/game-engine:/app/packages/game-engine
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rps_animal_showdown}
      POSTGRES_USER: ${POSTGRES_USER:-rps_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  frontend_node_modules:
  postgres_data:
