services:
  - type: web
    name: rps-animal-showdown-api
    runtime: python
    buildCommand: pip install --no-cache-dir -r apps/backend/requirements.txt && pip install --no-cache-dir ./packages/game-engine
    startCommand: uvicorn app.main:app --app-dir apps/backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: REALTIME_TICKET_SIGNING_KEY
        sync: false
