name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20.19.0"
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint:frontend
      - run: npm run build:frontend

  python:
    name: Python, migrations and realtime checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rps_ci
          POSTGRES_USER: rps_ci
          POSTGRES_PASSWORD: rps_ci_password
        options: >-
          --health-cmd "pg_isready -U rps_ci -d rps_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      # psycopg consumes the libpq form. The PostgreSQL integration test derives
      # the SQLAlchemy-only DATABASE_URL for the Alembic subprocess.
      RPS_TEST_DATABASE_URL: postgresql://rps_ci:rps_ci_password@localhost:5432/rps_ci
      # Ephemeral CI-only value. Production supplies this secret outside Git.
      REALTIME_TICKET_SIGNING_KEY: rps-ci-only-realtime-ticket-signing-key-not-for-production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r apps/backend/requirements.txt -r apps/backend/requirements-dev.txt -r database/migrations/requirements.txt
      - run: python -m pip install -e packages/game-engine pip-audit
      - run: pip-audit -r apps/backend/requirements.txt
      - run: python -m compileall -q apps/backend packages/game-engine realtime database/migrations
      - name: Apply migrations and run PostgreSQL integration checks
        run: python -m pytest -q database/migrations/tests/test_postgres_constraints.py
      - name: Run backend, engine, realtime and migration checks
        run: python -m pytest -q apps/backend/tests packages/game-engine/tests realtime/tests database/migrations/tests
